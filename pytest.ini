[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = dev _legacy_pre_refactor *_refactor_fixtures windows-worker
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    slow: langere/full-fixture runs (500+ items)
    integration: raakt DB of externe services (SQLite of Supabase)
    unit: pure functie-tests met fixtures/mocks
